<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор «Manifest» для SteamLuaTools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1013;
            --card-bg: #17191e;
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: #111216;

            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;

            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;

            --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background-color: rgba(59, 130, 246, 0.3);
            color: #ffffff;
        }

        body {
            min-height: 100vh;
            font-family: var(--font-sans);
            background-color: var(--bg-dark);
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.7;
        }

        header {
            position: fixed;
            top: 16px;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 0 20px;
            pointer-events: none;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-pill {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(23, 25, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 6px 16px 6px 8px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .logo-pill:hover {
            background: rgba(30, 33, 40, 0.95);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: #1f232b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: color 0.25s ease;
        }

        .logo-pill:hover .logo-icon {
            color: var(--accent-blue);
        }

        .logo-text {
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .nav-actions {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-gh-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .nav-gh-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 24px 60px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-grid {
            display: grid;
            grid-template-cols: 1fr 1.05fr;
            gap: 60px;
            align-items: center;
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .hero-title {
            font-weight: 800;
            font-size: 3.4rem;
            line-height: 1.05;
            letter-spacing: -0.03em;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .hero-serif-subhead {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 500;
            line-height: 1.3;
            color: var(--text-muted);
        }

        .hero-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .command-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-label {
            font-family: var(--font-mono);
            font-size: 0.76rem;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-label i {
            color: var(--accent-blue);
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 6px 6px 6px 16px;
            transition: all 0.25s ease;
        }

        .search-input-wrapper:focus-within {
            border-color: var(--accent-blue);
            background: #15171c;
        }

        .prompt-symbol {
            font-family: var(--font-mono);
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 1rem;
            margin-right: 12px;
            user-select: none;
        }

        .search-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .search-input-wrapper input::placeholder {
            color: var(--text-dim);
            font-family: var(--font-sans);
            font-weight: 400;
        }

        .btn-blue {
            background: var(--accent-blue);
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 0.9rem;
            color: #ffffff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-blue:hover {
            background: var(--accent-blue-hover);
            transform: translateY(-1px);
        }

        .btn-blue:active {
            transform: scale(0.98);
        }

        .btn-blue:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none !important;
        }

        .terminal-box {
            background: #111216;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
            margin-top: 8px;
        }

        .terminal-topbar {
            background: #17191e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .mac-dots {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mac-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .mac-dot.close {
            background: #ef4444;
        }

        .mac-dot.min {
            background: #f59e0b;
        }

        .mac-dot.max {
            background: #10b981;
        }

        .terminal-path {
            font-family: var(--font-mono);
            font-size: 0.74rem;
            color: var(--text-dim);
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.8rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .copy-btn:hover {
            color: var(--text-main);
        }

        .terminal-content {
            padding: 18px 20px;
            min-height: 110px;
            max-height: 220px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.86rem;
            line-height: 1.6;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .terminal-content::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .terminal-footer {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-badge-success {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .status-badge-error {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .hidden {
            display: none !important;
        }

        footer {
            margin-top: 60px;
            border-top: 1px solid var(--card-border);
            padding-top: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .footer-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 100px;
            padding: 10px 22px;
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .footer-pill:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .footer-pill.discord-pill:hover {
            border-color: rgba(88, 101, 242, 0.5);
            color: #818cf8;
            background: rgba(88, 101, 242, 0.12);
        }

        .footer-copyright {
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 990px) {
            main {
                padding-top: 100px;
            }

            .hero-grid {
                grid-template-cols: 1fr;
                gap: 40px;
            }

            .hero-title {
                font-size: 2.6rem;
            }

            .hero-serif-subhead {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 540px) {
            .hero-title {
                font-size: 2.1rem;
            }

            .search-input-wrapper {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
                gap: 10px;
            }

            .btn-blue {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>


    <header>
        <nav>
            <a href="/" class="logo-pill">
                <div class="logo-icon">
                    <i class="fab fa-steam"></i>
                </div>
                <span class="logo-text">SteamLuaTools</span>
            </a>

            <div class="nav-actions">
                <a href="https://github.com/rodekplay" target="_blank" class="nav-gh-btn">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                </a>
            </div>
        </nav>
    </header>

    <main>
        <div class="hero-grid">

            <div class="hero-left">
                <h1 class="hero-title">Генератор «Manifest»</h1>
                <div class="hero-serif-subhead">
                    для SteamLuaTools
                </div>
            </div>

            <div class="hero-right">

                <div class="command-card">
                    <div class="card-label">
                        <i class="fas fa-terminal"></i> Скачать манифест по AppID
                    </div>

                    <div class="search-input-wrapper">
                        <span class="prompt-symbol">$</span>
                        <input type="text" id="gameId" placeholder="Введите AppID (например, 220968)"
                            autocomplete="off" />
                        <button id="checkBtn" class="btn-blue">
                            <i class="fas fa-download"></i> Скачать
                        </button>
                    </div>
                </div>

                <div id="resultsSection" class="terminal-box hidden">
                    <div class="terminal-topbar">
                        <div class="mac-dots">
                            <span class="mac-dot close"></span>
                            <span class="mac-dot min"></span>
                            <span class="mac-dot max"></span>
                        </div>
                        <div class="terminal-path">bash - manifest_fetcher.sh</div>
                        <button class="copy-btn" id="copyLogBtn" title="Копировать лог">
                            <i class="far fa-copy"></i>
                        </button>
                    </div>

                    <div class="terminal-content" id="terminalOutput"></div>

                    <div id="terminalFooter" class="terminal-footer hidden">
                        <div id="notFoundSection" class="hidden">
                            <span class="status-badge-error">
                                <i class="fas fa-xmark"></i> Манифест не найден
                            </span>
                        </div>
                        <div id="successSection" class="hidden">
                            <span class="status-badge-success">
                                <i class="fas fa-check"></i> Загрузка началась
                            </span>
                        </div>
                    </div>
                </div>

            </div>

        </div>

        <footer>
            <div class="footer-buttons">
                <a href="https://github.com/rodekplay" target="_blank" class="footer-pill">
                    <i class="fab fa-github"></i> GitHub Repository
                </a>
                <a href="https://rodekplay.github.io/cs-news.github.io/" target="_blank"
                    class="footer-pill discord-pill">
                    <i class="fab fa-discord"></i> Discord Community
                </a>
            </div>

            <div class="footer-copyright">
                SteamLuaTools • 2026
            </div>
        </footer>
    </main>

    <script>
        (function () {
            "use strict";

            const gameIdInput = document.getElementById('gameId');
            const checkBtn = document.getElementById('checkBtn');
            const resultsSection = document.getElementById('resultsSection');
            const terminalOutput = document.getElementById('terminalOutput');
            const terminalFooter = document.getElementById('terminalFooter');
            const notFoundSection = document.getElementById('notFoundSection');
            const successSection = document.getElementById('successSection');
            const copyLogBtn = document.getElementById('copyLogBtn');

            function resetUI() {
                notFoundSection.classList.add('hidden');
                successSection.classList.add('hidden');
                terminalFooter.classList.add('hidden');
                terminalOutput.textContent = '';
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-download"></i> Скачать';
            }

            function typeText(text, callback) {
                let index = 0;
                terminalOutput.textContent = '';
                function tick() {
                    if (index < text.length) {
                        terminalOutput.textContent += text.charAt(index);
                        index++;
                        terminalOutput.scrollTop = terminalOutput.scrollHeight;
                        setTimeout(tick, 14);
                    } else {
                        if (callback) callback();
                    }
                }
                tick();
            }

            function triggerDownload(url) {
                const a = document.createElement('a');
                a.href = url;
                a.download = '';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            async function checkManifest() {
                const gameId = gameIdInput.value.trim();

                if (!gameId || !/^\d+$/.test(gameId)) {
                    resultsSection.classList.remove('hidden');
                    terminalFooter.classList.remove('hidden');
                    notFoundSection.classList.remove('hidden');
                    successSection.classList.add('hidden');
                    typeText('⚠️ Ошибка: введите корректный Steam AppID (только цифры).');
                    return;
                }

                checkBtn.disabled = true;
                checkBtn.innerHTML = '<span class="spinner"></span> Поиск...';

                resultsSection.classList.remove('hidden');
                terminalFooter.classList.add('hidden');
                notFoundSection.classList.add('hidden');
                successSection.classList.add('hidden');

                const startMsg = `🔍 Проверка манифеста для AppID: ${gameId}\n📡 Подключение к базе ManifestHub2...\n`;
                await new Promise((resolve) => {
                    typeText(startMsg, resolve);
                });

                try {
                    const response = await fetch(`https://api.github.com/repos/SSMGAlt/ManifestHub2/branches/${gameId}`, {
                        headers: { 'Accept': 'application/vnd.github.v3+json' }
                    });

                    if (response.status === 200) {
                        const foundMsg = `✅ Манифест найден в базе!\n📦 Подготовка архива ZIP...\n`;
                        await new Promise((resolve) => {
                            typeText(foundMsg, resolve);
                        });

                        const zipUrl = `https://codeload.github.com/SSMGAlt/ManifestHub2/zip/refs/heads/${gameId}`;

                        terminalOutput.textContent += `✔ Готово. Загрузка стартовала!`;
                        terminalOutput.scrollTop = terminalOutput.scrollHeight;

                        triggerDownload(zipUrl);

                        terminalFooter.classList.remove('hidden');
                        successSection.classList.remove('hidden');

                    } else {
                        const notFoundMsg = `❌ Манифест для AppID ${gameId} не найден в базе.\nПопробуйте другой ID.`;
                        await new Promise((resolve) => {
                            typeText(notFoundMsg, resolve);
                        });
                        terminalFooter.classList.remove('hidden');
                        notFoundSection.classList.remove('hidden');
                    }
                } catch (err) {
                    const errorMsg = `⚠️ Ошибка соединения. Проверьте интернет-подключение.\n${err.message || ''}`;
                    await new Promise((resolve) => {
                        typeText(errorMsg, resolve);
                    });
                    terminalFooter.classList.remove('hidden');
                    notFoundSection.classList.remove('hidden');
                } finally {
                    checkBtn.disabled = false;
                    checkBtn.innerHTML = '<i class="fas fa-download"></i> Скачать';
                }
            }

            checkBtn.addEventListener('click', function (e) {
                e.preventDefault();
                resetUI();
                checkManifest();
            });

            gameIdInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    resetUI();
                    checkManifest();
                }
            });

            copyLogBtn.addEventListener('click', function () {
                const text = terminalOutput.textContent;
                if (!text) return;
                navigator.clipboard.writeText(text).then(() => {
                    const original = copyLogBtn.innerHTML;
                    copyLogBtn.innerHTML = '<i class="fas fa-check" style="color: #4ade80;"></i>';
                    setTimeout(() => {
                        copyLogBtn.innerHTML = original;
                    }, 1500);
                });
            });

            console.log('SteamLuaTools Manifest Generator — Steam Logo Added');
        })();
    </script>
</body>

</html>
